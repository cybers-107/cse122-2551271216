<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bốn mùa</title>
  <style>
    :root {
      --nen-khung: #FFFDE7;
      --vien: #9E9E9E;
      --do: #D40000;
      --xanh: #0033CC;
      --nen-tieu-de: #FFD9E6;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .khung-tho {
      background: var(--nen-khung);
      border: 1px solid var(--vien);
      width: 640px;
      max-width: 100%;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      text-transform: uppercase;
      color: var(--do);
      font-weight: bold;
      font-size: 26px;
      background: var(--nen-tieu-de);
      padding: 6px 0;
      margin: 0 0 20px;
      text-align: center;
    }
    .kho {
      font-style: italic;
      line-height: 1.7;
      text-align: center;
    }
    .xanh { color: var(--xanh); }
    .do { color: var(--do); }
    hr {
      width: 55%;
      margin: 16px auto;
      border: none;
      border-top: 1px solid var(--xanh);
    }
  </style>
</head>
<body>
  <article class="khung-tho">
    <h1>BỐN MÙA</h1>
    <p class="kho xanh">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>
    <hr>
    <p class="kho do">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>
    <hr>
    <p class="kho xanh">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </article>
</body>
</html>
